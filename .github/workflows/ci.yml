name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: macOS build and test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      # Exercises the built inspector binary end to end, not just its types.
      - name: Smoke-test the inspector CLI
        run: |
          swift run ReceiptInspector --help

          summary="$(swift run ReceiptInspector --lines Tests/BakeAppOCRTests/Fixtures/cafe-order.txt)"
          echo "$summary"
          echo "$summary" | grep -q "10432" || {
            echo "::error::expected order number 10432 in the summary"
            exit 1
          }

          swift run ReceiptInspector --json --lines Tests/BakeAppOCRTests/Fixtures/cafe-order.txt \
            | python3 -m json.tool > /dev/null

          echo "Inspector CLI produced a valid summary and valid JSON."

  # The camera code and the SwiftUI views are behind `#if os(iOS)` / `#if
  # os(macOS)`, so a single `swift build` never compiles both. This job is what
  # actually type-checks the iOS half.
  ios:
    name: iOS build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Available schemes
        run: xcodebuild -list

      - name: Build for iOS
        run: |
          xcodebuild build \
            -scheme BakeAppOCR \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO
